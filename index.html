<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>6_7</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.container {
  text-align: center;
}

.number {
  font-size: 110px;
  font-weight: 900;
  color: white;
  letter-spacing: 8px;
  text-shadow:
    0 0 10px white,
    0 0 30px white;
  animation: pulse 1.2s infinite;
}

button {
  margin-top: 30px;
  padding: 15px 35px;
  border: 2px solid white;
  border-radius: 50px;
  background: transparent;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.92);
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.12);
  }
}

.flash {
  animation: flash 0.4s;
}

@keyframes flash {
  50% {
    transform: scale(1.4);
    text-shadow:
      0 0 30px white,
      0 0 80px white;
  }
}
</style>
</head>

<body>

<div class="container">
  <div id="number" class="number">6_7</div>

  <button onclick="play67()">
    🔊 PLAY 6_7
  </button>
</div>

<script>
function play67() {
  const number = document.getElementById("number");

  // Animation
  number.classList.remove("flash");
  void number.offsetWidth;
  number.classList.add("flash");

  // Voice
  const voice = new SpeechSynthesisUtterance("six seven");
  voice.rate = 0.8;
  voice.pitch = 1.2;
  voice.volume = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(voice);
}
</script>

</body>
</html>
